name: Deploy (Vercel)

# Reusable Vercel deploy from CI. Vercel Hobby can't connect a private
# org-owned repo's Git integration, so we deploy from CI. The build runs ON
# VERCEL (no --prebuilt) so the Neon↔Vercel integration injects POSTGRES_URL
# and branches per preview, exactly as a Git-triggered deploy would.
# Caller example:
#   jobs:
#     deploy:
#       uses: pgsereno/workflows/.github/workflows/deploy-vercel.yml@main
#       with:
#         vercel-org-id: team_xxx
#         vercel-project-id: prj_xxx
#       secrets:
#         VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
#
# Preview-URL PR comment: since deploys no longer go through Vercel's Git
# integration, this workflow posts the preview URL as a sticky PR comment
# itself. That needs a writable GITHUB_TOKEN, and a reusable workflow can't
# elevate beyond the CALLER, so the caller's deploy job must grant it:
#   jobs:
#     deploy:
#       permissions:
#         contents: read
#         pull-requests: write
#       uses: pgsereno/workflows/.github/workflows/deploy-vercel.yml@main
# Without it the comment step is skipped (continue-on-error) — the deploy
# itself still succeeds.
on:
  workflow_call:
    inputs:
      vercel-org-id:
        description: Vercel team/org ID (not secret — lives in .vercel/project.json).
        type: string
        required: true
      vercel-project-id:
        description: Vercel project ID (not secret).
        type: string
        required: true
      vercel-cli-version:
        description: Vercel CLI version (or major) to install.
        type: string
        default: "63"
      ready-timeout-minutes:
        description: Minutes to wait for the deployment to finish before failing the job. Keep it under 25; the job is capped at 30.
        type: number
        default: 15
    secrets:
      VERCEL_TOKEN:
        required: true

jobs:
  deploy:
    name: Vercel Deploy
    runs-on: blacksmith
    # Hard cap on cost: a hung CLI or API call can never bill hours again. Keep
    # it above ready-timeout-minutes plus install/upload time.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
      VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}
    steps:
      # On pull_request, actions/checkout defaults to a DETACHED checkout of
      # the merge commit, so `vercel deploy` can't read a branch name and
      # records VERCEL_GIT_COMMIT_REF=HEAD. The Neon integration then names its
      # branch preview/$VERCEL_GIT_COMMIT_REF, collapsing every PR onto one
      # shared `preview/HEAD` branch — whose migration state drifts and breaks
      # `drizzle-kit migrate`. Checking out the named head branch gives Vercel
      # the real ref → one isolated Neon branch per PR. Empty on push → main.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm i -g vercel@${{ inputs.vercel-cli-version }}

      # `vercel deploy` waits only for READY or ERROR, so a deployment Vercel
      # parks in BLOCKED (commit author not on the team) kept it polling for
      # hours. Create it with --no-wait, then `vercel inspect --wait`, which
      # stops on any final state. --archive=tgz uploads one tarball instead
      # of many files, avoiding Vercel's per-day uploaded-file-count limit.
      - name: Deploy
        id: deploy
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TIMEOUT: ${{ inputs.ready-timeout-minutes }}m
        run: |
          # The CLI exits 1 when the deployment is created already BLOCKED, so
          # don't stop here: take the URL from either stream and ask Vercel.
          args=(--archive=tgz --yes --no-wait)
          [ "$GITHUB_EVENT_NAME" = push ] && args+=(--prod)
          vercel deploy "${args[@]}" > out.txt 2>&1 || true
          cat out.txt
          url=$(grep -oE 'https://[^ ]+\.vercel\.app' out.txt | tail -n1)
          [ -n "$url" ] || { echo "::error::vercel deploy did not create a deployment"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          # Scope to the "Inspect" line: the CLI also prints a telemetry docs URL.
          echo "inspect=$(grep -i inspect out.txt | grep -oE 'https://vercel\.com/[^ ]+' | head -n1)" >> "$GITHUB_OUTPUT"

          # Exits 0 on BLOCKED and 124 on timeout; the state check below decides.
          vercel inspect "$url" --wait --timeout "$TIMEOUT" --format json > inspect.json || true
          state=$(jq -r '.readyState // "UNKNOWN"' inspect.json)
          echo "state=$state" >> "$GITHUB_OUTPUT"
          if [ "$state" != READY ]; then
            echo "::error::Deployment $state: $(jq -r '.readyStateReason // empty' inspect.json) $url"
            exit 1
          fi

      # Replaces the comment the Vercel Git integration used to post. Sticky
      # via a hidden marker so re-runs update one comment instead of stacking.
      # continue-on-error: a caller that didn't grant pull-requests: write
      # still gets a green deploy, just no comment.
      - name: Comment preview URL on PR
        if: always() && github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          INSPECT_URL: ${{ steps.deploy.outputs.inspect }}
          STATE: ${{ steps.deploy.outputs.state }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const inspect = process.env.INSPECT_URL;
            const state = process.env.STATE || "UNKNOWN";
            const status = state === "READY" ? "✅ Ready" : `❌ ${state}`;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const updated = new Date().toISOString().replace("T", " ").slice(0, 16) + " UTC";
            const inspectCell = inspect ? `[Inspect](${inspect})` : "—";
            const previewCell = state === "READY" ? `[Visit Preview](${url})` : "—";
            const marker = "<!-- vercel-preview-deployment -->";
            const body = [
              marker,
              "### ▲ Vercel preview deploy",
              "",
              "| Project | Status | Preview | Inspect | Commit | Updated |",
              "|---|---|---|---|---|---|",
              `| \`${context.repo.repo}\` | ${status} | ${previewCell} | ${inspectCell} | \`${sha}\` | ${updated} |`,
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
